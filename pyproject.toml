[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "context-mapper"
dynamic = ["version"]
description = "Builds an interactive context map and Mermaid diagrams from a YAML domain model."
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Henrique Moody", email = "henriquemoody@gmail.com" },
]
keywords = ["domain-driven-design", "context-map", "mermaid", "diagrams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/henriquemoody/context-mapper"
Documentation = "https://github.com/henriquemoody/context-mapper#readme"
Repository = "https://github.com/henriquemoody/context-mapper"
Issues = "https://github.com/henriquemoody/context-mapper/issues"

[project.scripts]
context-mapper = "context_mapper.build:main"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_mapper = ["template/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

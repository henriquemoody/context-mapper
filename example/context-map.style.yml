# How the context map looks. What it describes lives in context-map.yml.
#
# Output: public/index.html, public/mermaid/*.html and public/markdown/*.md.
# Unknown keys fail the build.

# Box styles, keyed by the ids in context-map.yml. The keys are Mermaid's own
# classDef attributes (fill, stroke, stroke-width, ...), plus `collapsible:
# true` on a type whose entries are groups. The build checks them all, so a
# typo fails the build instead of drawing nothing.
types:
  core:       { fill: "#dedaff", stroke: "#6631d7" }
  supporting: { fill: "#c6dcff", stroke: "#305bab" }
  generic:    { fill: "#adf0c7", stroke: "#067429" }
  group:      { fill: "#eaf9ef", stroke: "#067429", collapsible: true }

# One group can override its type's look; the dashed stroke is built in.
groups:
  foundations: { fill: "#eaf9ef", stroke: "#067429" }

# A domain takes any attributes; it overrides `mermaid.domain_style` below and,
# when the domain is drawn as one box, its type colors.
domains:
  catalog: { fill: "#f7f7ff", stroke: "#6631d7" }

mermaid:
  direction: BT          # BT: upstream on top. Also TB, LR, RL.
  theme: base            # base, default, neutral, dark, forest
  layout: elk            # dagre (default) or elk
  look: handDrawn        # classic or handDrawn
  curve: step            # basis, linear, step, stepBefore, stepAfter, ...
  theme_variables:       # https://mermaid.js.org/config/theming.html
    fontFamily: "system-ui, sans-serif"
    fontSize: "14px"
    lineColor: "#313131"
  # Anything else Mermaid accepts: https://mermaid.js.org/config/schema-docs/config.html
  config:
    elk:
      mergeEdges: false
      nodePlacementStrategy: BRANDES_KOEPF
  # Merged over the above for public/markdown/*.md only. GitLab's built-in Mermaid has no ELK.
  markdown_config:
    layout: dagre

  # Defaults for every view. Each view below can override any of these.
  defaults:
    level: context         # context (bounded contexts inside domain boxes) or domain (one box per domain)
    depth: 1               # Hops out from the focus. 99 means everything.
    dir: both              # both, up (depends on), down (used by)
    groups: collapse       # show, hide, collapse (one box per group). Or a map: { foundations: collapse }
    group_labels: true     # With collapse: label each arrow with the members of the group it uses
    context_labels: true   # With level: domain, list the contexts inside each domain box
    group_by_type: false   # Wrap Core, Supporting, Generic in their own boxes

  focus_style: "stroke-width:4px,font-weight:bold"
  domain_style: "fill:#ffffff,stroke:#b0b0b0"   # The box around a domain's contexts
  edge_styles:
    solid:  "stroke:#313131,stroke-width:1.5px"
    dotted: "stroke:#313131,stroke-width:1.5px,stroke-dasharray:3 3"

  # Which pages to generate, each focused on one item: all, domains, contexts, or a list of ids.
  pages: all

  # Extra named views. Use any key from defaults, plus id, title, focus, description and direction.
  views:
    - id: overview
      title: Domains
      level: domain
      depth: 99
    - id: checkout-upstreams
      title: Everything Checkout depends on
      focus: checkout
      dir: up
      depth: 99

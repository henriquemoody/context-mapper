# How the context map looks. What it describes lives in context-map.yml.
#
# Output: public/index.html, public/mermaid/*.html and public/markdown/*.md.
# Unknown keys fail the build.

# How the map looks. The sections mirror context-map.yml — `types`, `clusters`,
# `context-map` — keyed by the same ids. The keys are Mermaid's own classDef
# attributes (fill, stroke, stroke-width, ...), plus `defaultDisplay` on any
# entry, saying how it first renders: expanded, collapsed, contents or hidden
# for a domain or a cluster; a bounded context — one box with nothing inside —
# only expanded or hidden. The build checks them all, so a typo fails the
# build instead of drawing nothing.
types:
  core:       { fill: "#dedaff", stroke: "#6631d7" }
  supporting: { fill: "#c6dcff", stroke: "#305bab" }
  generic:    { fill: "#adf0c7", stroke: "#067429" }

clusters:
  partners: { fill: "#eaf9ef", stroke: "#067429", stroke-dasharray: "4 3", defaultDisplay: collapsed }

# An entry takes any attributes: a domain's overrides `mermaid.domain_style`
# below and, drawn as one box, its type colors; a bounded context's styles its
# own box. Any entry also takes `defaultDisplay`, saying how it first renders —
# a bounded context, which holds nothing inside, only expanded or hidden.
context-map:
  cargo: { fill: "#f7f7ff", stroke: "#6631d7" }

# Links the interactive page shows in its header, in this order: the link's
# text, then where it goes — a repository, an issue tracker, anything.
# Without this section the header shows no links.
links:
  Repository: https://github.com/henriquemoody/context-mapper
  Issues: https://github.com/henriquemoody/context-mapper/issues
  DDD Sample: https://github.com/citerus/dddsample-core

mermaid:
  direction: BT          # BT: upstream on top. Also TB, LR, RL.
  theme: base            # base, default, neutral, dark, forest
  layout: elk            # dagre (default) or elk
  look: handDrawn        # classic or handDrawn
  curve: step            # basis, linear, step, stepBefore, stepAfter, ...
  theme_variables:       # https://mermaid.js.org/config/theming.html
    fontFamily: "system-ui, sans-serif"
    fontSize: "14px"
    lineColor: "#313131"
  # Anything else Mermaid accepts: https://mermaid.js.org/config/schema-docs/config.html
  config:
    elk:
      mergeEdges: false
      nodePlacementStrategy: BRANDES_KOEPF
  # Merged over the above for public/markdown/*.md only. GitLab's built-in Mermaid has no ELK.
  markdown_config:
    layout: dagre

  # Whether a dependency's roles are drawn: short codes (OHS, PL, S, ACL, CF, C) beside each end of the arrow,
  # or on the middle of it in the Markdown. Tooltips and the lists still show them when this is false.
  relationship_labels: true

  # Defaults for every view. Each view below can override any of these.
  defaults:
    level: context         # context (bounded contexts inside domain boxes) or domain (one box per domain)
    depth: 1               # Hops out from the focus. 99 means everything.
    dir: both              # both, up (depends on), down (used by)
    display: {}            # How containers first render: expanded, collapsed, contents, hidden — or a map by id
    hide: []               # Ids this view never draws: a domain or cluster (with what's inside), or a bounded context
    child_labels: true     # A collapsed container names what it holds, in the box and on each arrow
    group_by_type: false   # Wrap Core, Supporting, Generic in their own boxes

  # Styles are maps of Mermaid attributes here too, like the ones above.
  focus_style:             # The focused item
    stroke-width: "4px"
    font-weight: bold
  domain_style:            # The box around a domain's contexts
    fill: "#ffffff"
    stroke: "#b0b0b0"
  edge_styles:
    solid:
      stroke: "#313131"
      stroke-width: "1.5px"
    dotted:
      stroke: "#313131"
      stroke-width: "1.5px"
      stroke-dasharray: "3 3"

  # Which pages to generate, each focused on one item: all, domains, contexts, or a list of ids.
  pages: all

  # Extra named views. Use any key from defaults, plus id, title, focus, description and direction.
  views:
    - id: overview
      title: Domains
      level: domain
      depth: 99
      hide: [billing]          # the whole system, without Billing
    - id: partners-detail
      title: Outside Partners in detail
      focus: partners
      depth: 1
    - id: booking-upstreams
      title: Everything Booking depends on
      focus: booking
      dir: up
      depth: 99
    - id: handling-detail
      title: Handling, without Incident Logging
      focus: handling
      depth: 99
      hide: [incident-logging] # a domain view can hide one of its bounded contexts

# Source of truth for the context map.
#
# The model is the cargo shipping system from Eric Evans's "Domain-Driven
# Design" (chapters 7 and 14), as the DDD Sample app built it. Cargo gets
# booked, routed over voyages, handled in ports and tracked by the customer.
#
# Three kinds of thing, in three sections:
# - `types` is the role vocabulary of the model: a domain or bounded context
#   has one, and it colors the box.
# - `clusters` names a set of domains or contexts treated together; its members
#   point at it with `cluster:`.
# - `context-map` maps each id to what it is, so nothing can be described
#   twice: an entry with a `domain:` key is a bounded context of that domain,
#   and any other entry is a domain — one no context points at is a single
#   bounded context. Every entry can carry `downstreams`, who depends on it and
#   why, and the interactive page shows the reason as a tooltip when you hover
#   over that arrow:
#
#   routing:
#     downstreams:
#       booking: Proposes itineraries for a route specification.
#
# An entry can also record a `violations`: a dependency that goes against the
# direction, such as an upstream that calls its own downstream. It is real, and
# wrong, so the build draws it as a red arrow instead of failing on the cycle it
# makes, and keeps it out of what a focus reaches. Fix it, then delete the line.
#
#   handling-history:
#     violations:
#       booking: Loads the Cargo to attach each event to it.
#
# A dependency can say what each side of it is, with the context-map patterns:
# `upstream` takes OpenHostService, PublishedLanguage and Supplier; `downstream`
# takes AnticorruptionLayer, Conformist and Customer. The diagram shows them as
# short codes next to each end of the arrow, and the tooltip spells them out.
#
#   pathfinder:
#     downstreams:
#       routing:
#         upstream: [OpenHostService, PublishedLanguage]
#         downstream: [AnticorruptionLayer]
#
# Two entries can also have no direction between them at all, on purpose.
# `partnerships` names the ones whose teams plan and ship together;
# `sharedKernels` the ones that share part of the model itself, such as code,
# types or a schema. Declare a pair once, on either entry: it is drawn as a line
# with no heads, and the entry that declares it goes where an upstream goes.
# Moving the line to the other entry flips it.
#
#   voyage-scheduling:
#     partnerships:
#       routing: Change the schedules and the route planning together.
#
# Every entry can also carry a `description`: the interactive page shows it as
# a tooltip when you hover over its box, and the item's page shows it in text.
#
# Entries can also set `attributes`: the ones the `attributes` section
# below declares. The build fails on an attribute that was never declared,
# or a value of the wrong shape for the one it declares, so a typo breaks
# the build instead of hiding. An attribute of `type: any` takes whatever
# shape: one named `metadata` is the free-form way, there when a model
# wants it and not built in.
#
# A dependency can point at a domain when we don't know yet which of its
# contexts is involved. Move it to the right context once we know.
#
# How it looks (colors, layout, views) lives in context-map.style.yml.

types:
  core:       { name: Core }
  supporting: { name: Supporting }
  generic:    { name: Generic }

# A cluster: its members point at it with `cluster:`.
clusters:
  partners: { name: Outside Partners }

# Attributes, declared once: any entry in `context-map` or `clusters` can
# set them with `attributes:`. `text` takes a single value, `list` a list
# of them, `map` label-to-value pairs, `any` whatever shape. The item's page
# and the interactive panel show them under the description.
attributes:
  service:    { name: Application service, type: text }
  aggregates: { name: Aggregates, type: list }
  metadata:   { type: any }

# A context takes its domain's `type` unless it sets its own.
context-map:
  # Outside partners: systems we don't own.
  pathfinder:
    name: Pathfinder
    type: generic
    cluster: partners
    description: Finds paths through the transport network. A third-party service we don't own.
    attributes:
      metadata: { owned by: Routing vendor, protocol: SOAP }
    downstreams:
      routing:                                      # a styled edge: colors live in context-map.style.yml
        comment: Finds the paths. Routing translates them behind an anti-corruption layer.
        style: dotted
        upstream: [OpenHostService, PublishedLanguage]   # a service anyone can call, in a format it publishes
        downstream: [AnticorruptionLayer]               # Routing keeps the vendor's model out of its own
  port-terminals:
    name: Port Terminals
    type: generic
    cluster: partners
    description: The systems in each port. They see cargo loaded, unloaded and cleared by customs.
    downstreams:
      incident-logging:
        comment: Reports each load, unload, receive, claim and customs event.
        downstream: [AnticorruptionLayer]               # the reports are checked before anything trusts them

  location:
    name: Location
    type: generic
    description: Ports and places, by UN/LOCODE.
    attributes:
      aggregates: [Location]
    downstreams:
      booking:
        comment: Names where the cargo starts and where it ends.
        upstream: [PublishedLanguage]                   # UN/LOCODE, a code everyone shares
      voyage-scheduling:
        comment: Names the ports of each carrier movement.
        upstream: [PublishedLanguage]
      handling-history:
        comment: Names the port where each event happened.
        upstream: [PublishedLanguage]

  customer:
    name: Customer
    type: supporting
    description: Shippers, consignees and payers, and their agreements.
    attributes:
      aggregates: [Customer]
    downstreams:
      booking: Says who ships, who receives and who pays for each cargo.

  transport-network:
    name: Transport Network
    type: core
    description: The voyages we run, and the routes we can build from them.
  voyage-scheduling:
    name: Voyage Scheduling
    domain: transport-network
    type: supporting                                # a context can override its domain's type
    description: Plans the voyages. A voyage is a list of carrier movements, port to port.
    attributes:
      aggregates: [Voyage]
    partnerships:                                   # no direction: both teams plan and ship together
      routing: Routes are only as good as the schedules, so the two teams change them together.
    downstreams:
      handling-history: Names the voyage a cargo went on or came off.
  routing:
    name: Routing
    domain: transport-network
    description: Takes a route specification and finds the itineraries that meet it.
    attributes:
      service: RoutingService
    downstreams:
      booking:                                      # Routing answers to what Booking asks for
        comment: Proposes itineraries for a route specification.
        upstream: [Supplier]
        downstream: [Customer]

  handling:
    name: Handling
    type: core
    description: What really happened to each cargo in the ports.
  incident-logging:
    name: Incident Logging
    domain: handling
    type: supporting
    description: Takes the reports from the ports and checks them. Only the good ones count.
    attributes:
      service: ApplicationEvents
    downstreams:
      handling-history: Turns each good report into a handling event.
  handling-history:
    name: Handling History
    domain: handling
    description: Every handling event of every cargo. The delivery status comes from here.
    attributes:
      service: HandlingEventService
      aggregates: [HandlingEvent]
    downstreams:
      booking: Gives the events that say where a cargo is and whether it's on track.
      tracking: Shows the customer where the cargo has been.
    violations:                                     # Handling is upstream of Booking, and still calls it
      booking: Loads the Cargo to attach each event to it. It's the two-way link Evans warns against.

  cargo:
    name: Cargo
    type: core
    description: The core of the business. What the customer ships, and how it gets there.
  booking:
    name: Booking
    domain: cargo
    description: Books a cargo, gives it a route and checks it's on track.
    attributes:
      service: BookingService
      aggregates: [Cargo]
    sharedKernels:                                  # no direction: both use the same part of the model
      tracking: Both use the same Cargo, Itinerary and Delivery classes.
  tracking:
    name: Tracking
    domain: cargo
    type: supporting
    description: Lets the customer follow a cargo by its tracking id.

  billing:
    name: Billing
    type: generic
    description: Invoices payers. It knows nothing about cargo.
    downstreams:
      booking:
        comment: Invoices the payer of each delivered cargo. Booking speaks Billing's language, not the other way round.
        downstream: [Conformist]

# Source of truth for the context map.
#
# The `context-map` section maps each id to what it is, so nothing can be
# described twice: an entry with a `domain:` key is a bounded context of that
# domain, an entry others' `group:` points at is a group, and anything else is
# a domain. Every entry can carry `downstreams`, who
# depends on it and why, and the interactive page shows the reason as a tooltip
# when you hover over that arrow:
#
#   billing:
#     downstreams:
#       packaging: Charges for Packages and Subscriptions
#       pro-account: Charges the monthly subscription
#
# Every entry can also carry a `description`: the interactive page shows it as
# a tooltip when you hover over its box, and the item's page shows it in text.
#
# A domain no context points at is a single bounded context with the same name.
# A dependency can point at a domain when we don't know yet which of its
# contexts is involved. Move it to the right context once we know.
#
# How it looks (colors, layout, views) lives in context-map.style.yml.

types:
  core:       { label: Core }
  supporting: { label: Supporting }
  generic:    { label: Generic }

# A context takes its domain's `type` and `group` unless it sets its own.
context-map:
  # A group: an entry others' `group` points at. Views can show, hide, or fold
  # its members into one box.
  foundations:
    name: Shared Foundations
  # Shared foundations: used by most domains.
  identity:
    name: Identity
    type: generic
    group: foundations
    description: Accounts and logins. Everyone signs in here.
    downstreams:
      checkout: Creates an account for guests who check out.
      crm:                                          # a bare key: depends on it, no comment yet
  payments:
    name: Payments
    type: generic
    group: foundations
    downstreams:
      checkout: Charges the payment method and signals whether it went through.
      fulfillment: Captures the payment once the order ships, and refunds returns.

  catalog:
    name: Catalog
    type: core
    description: Everything that can be bought, with its prices and availability.
    downstreams:                                    # the whole catalog: we don't know which context yet
      checkout:
        comment: Reads prices and availability at checkout time.
        style: dotted                               # a styled edge: colors live in context-map.style.yml
  browsing:
    name: Browsing
    domain: catalog
  search:
    name: Search
    domain: catalog

  orders:
    name: Orders
    type: core
    downstreams:                                    # a dependency pointing at a whole domain
      crm: Reads orders to sync them into the ticket system.
  checkout:
    name: Checkout
    domain: orders
    description: Takes a cart and turns it into a paid order.
  fulfillment:
    name: Fulfillment
    domain: orders
    type: supporting                                # a context can override its domain's type

  crm:
    name: CRM
    type: supporting

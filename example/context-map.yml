# Source of truth for the context map.
#
# Domains group bounded contexts. Dependencies are between bounded contexts:
# each entry names an `upstream` and the `downstream` contexts that depend on it.
# A downstream can carry a note about why it depends on the upstream, and the
# interactive page shows it as a tooltip when you hover over that arrow.
#
# A domain without `contexts` is a single bounded context with the same name.
# A dependency can point at a domain when we don't know yet which of its
# contexts is involved. Move it to the right context once we know.
#
# How it looks (colors, layout, views) lives in context-map.style.yml.

types:
  core:       { label: Core }
  supporting: { label: Supporting }
  generic:    { label: Generic }

# Groups collect domains or contexts that views can show, hide, or fold into one box.
groups:
  - { id: foundations, name: Shared Foundations }

# A context takes its domain's `type` and `group` unless it sets its own.
domains:
  # Shared foundations: used by most domains.
  - { id: identity, name: Identity, type: generic, group: foundations }
  - { id: legal,    name: Legal Agreements, type: generic, group: foundations }

  - id: business
    name: Business
    type: supporting
    contexts:
      - { id: registry, name: Business Registry }
      - { id: reviews,  name: Reviews, type: core }   # a context can override its type

  - id: marketplace
    name: Marketplace
    type: core
    contexts:
      - { id: matching, name: Matching }
      - { id: crm,      name: CRM Integrations }

dependencies:
  - upstream: identity
    downstream:
      - registry
  - upstream: legal
    downstream:
      - { id: registry, comment: Requests the terms and conditions a business signed }
  # `style: dotted` on a dependency entry draws its arrows dotted.
  - upstream: legal
    style: dotted
    downstream:
      - { id: matching, comment: Checks that a match only happens under a current agreement }
  # crm depends on the marketplace as a whole: we don't know which context yet.
  - upstream: marketplace
    downstream:
      - { id: crm, comment: Reads leads to sync them }
  - upstream: reviews
    downstream:
      - { id: matching, comment: Weighs reviews when ranking matches }

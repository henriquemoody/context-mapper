<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Map</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f7; --ink: #1a1a1a; --muted: #595959;
    --line: #e7e7e7; --edge: #313131; --accent: #305bab;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  select, button { font: inherit; padding: 4px 8px; border: 1px solid #b0b0b0; border-radius: 6px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  main { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 58px); }
  #graph { min-height: 400px; overflow: auto; padding: 16px; }
  #graph svg { max-width: 100%; height: auto; }
  #graph a, #graph a *, #graph .clickable, #graph .clickable * { cursor: pointer; }
  /* Hovering an arrow lights it up and dims the rest. The wide transparent copy is what catches the mouse. */
  #graph .edge-hit { fill: none; stroke: transparent; stroke-width: 14px; pointer-events: stroke; cursor: pointer; }
  #graph svg.hovering .flowchart-link:not(.edge-on) { opacity: .15; }
  #graph svg.hovering .edgeLabel:not(.edge-on) { opacity: .25; }
  #graph svg.hovering .box:not(.node-on) { opacity: .45; }
  #graph .flowchart-link.edge-on { stroke: var(--accent) !important; stroke-width: 3.5px !important; }
  #graph .flowchart-link, #graph .box, #graph .edgeLabel { transition: opacity .12s; }
  #tip { display: none; position: fixed; z-index: 10; max-width: 320px; padding: 8px 10px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 13px; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #tip p { margin: 0; }
  #tip p + p { margin-top: 6px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow: auto; }
  aside h2 { font-size: 20px; margin: 0 0 4px; }
  aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  aside ul { margin: 0; padding-left: 18px; }
  aside a { color: var(--accent); text-decoration: none; cursor: pointer; }
  aside a:hover { text-decoration: underline; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .hint { color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Context Map</h1>
  <label>Show
    <select id="level">
      <option value="context">Bounded contexts</option>
      <option value="domain">Domains</option>
    </select>
  </label>
  <label>Focus
    <select id="focus"><option value="">Whole system</option></select>
  </label>
  <label>Depth
    <select id="depth">
      <option value="1">1 hop</option>
      <option value="2">2 hops</option>
      <option value="99">All</option>
    </select>
  </label>
  <label>Direction
    <select id="dir">
      <option value="both">Both</option>
      <option value="up">Depends on (upstream)</option>
      <option value="down">Used by (downstream)</option>
    </select>
  </label>
  <span id="groups"></span>
  <button id="reset">Reset</button>
</header>
<main>
  <div id="graph"></div>
  <aside id="info"></aside>
</main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const MODEL = /*__MODEL__*/null;

// Lookups. A "single" domain is one bounded context with the same id.
const domainById = Object.fromEntries(MODEL.domains.map(d => [d.id, d]));
const contextById = Object.fromEntries(MODEL.contexts.map(c => [c.id, c]));
const owner = {};
MODEL.contexts.forEach(c => owner[c.id] = c.domain);
MODEL.domains.forEach(d => owner[d.id] = d.id);
const nameOf = id => (contextById[id] || domainById[id]).name;
const isMulti = id => domainById[id] && !domainById[id].single;

// Same graphs as graph.py: context level as written, domain level lifted and merged.
function levelGraph(level) {
  if (level === "context") {
    const nodes = new Set([...MODEL.contexts.map(c => c.id), ...MODEL.domains.filter(d => !d.single).map(d => d.id)]);
    const groups = {};
    MODEL.contexts.filter(c => c.group).forEach(c => groups[c.id] = c.group);
    MODEL.domains.filter(d => !d.single && d.group).forEach(d => groups[d.id] = d.group);
    return { nodes, groups, edges: MODEL.edges.map(e => ({ from: e.from, to: e.to, styles: new Set([e.style]), via: [e] })) };
  }
  const merged = new Map();
  MODEL.edges.forEach(e => {
    const a = owner[e.from], b = owner[e.to];
    if (a === b) return;
    const key = a + "|" + b;
    if (!merged.has(key)) merged.set(key, { from: a, to: b, styles: new Set(), via: [] });
    merged.get(key).styles.add(e.style);
    merged.get(key).via.push(e);
  });
  const groups = {};
  MODEL.domains.filter(d => d.group).forEach(d => groups[d.id] = d.group);
  return { nodes: new Set(MODEL.domains.map(d => d.id)), groups,
           edges: [...merged.values()] };
}
const GRAPHS = { context: levelGraph("context"), domain: levelGraph("domain") };

function focusSet(level, focus) {
  if (!focus) return new Set();
  if (level === "domain") return new Set([owner[focus]]);
  if (isMulti(focus)) return new Set([focus, ...domainById[focus].contexts]);
  return new Set([focus]);
}

function walk(g, starts, depth, dir, hiddenGroups) {
  const allowed = n => starts.has(n) || !hiddenGroups.has(g.groups[n]);
  if (!starts.size) return new Set([...g.nodes].filter(allowed));
  const up = {}, down = {};
  g.nodes.forEach(n => { up[n] = []; down[n] = []; });
  g.edges.forEach(e => { up[e.from].push(e.to); down[e.to].push(e.from); });
  const seen = new Set(starts);
  const go = next => {
    let frontier = [...starts];
    for (let i = 0; i < depth && frontier.length; i++) {
      const nf = [];
      frontier.forEach(n => next[n].forEach(m => { if (!seen.has(m) && allowed(m)) { seen.add(m); nf.push(m); } }));
      frontier = nf;
    }
  };
  if (dir !== "down") go(up);
  if (dir !== "up") go(down);
  return seen;
}

function relations(id) {
  const g = isMulti(id) ? GRAPHS.domain : GRAPHS.context;
  const byName = (a, b) => nameOf(a).localeCompare(nameOf(b));
  return {
    ups: g.edges.filter(e => e.from === id).map(e => e.to).sort(byName),
    downs: g.edges.filter(e => e.to === id).map(e => e.from).sort(byName),
  };
}

const $ = id => document.getElementById(id);
const levelSel = $("level"), focusSel = $("focus"), depthSel = $("depth"), dirSel = $("dir");

(function fillFocus() {
  const byName = (a, b) => a.name.localeCompare(b.name);
  const group = (label, items) => {
    const og = document.createElement("optgroup");
    og.label = label;
    items.sort(byName).forEach(i => og.appendChild(new Option(i.name, i.id)));
    focusSel.appendChild(og);
  };
  group("Domains", MODEL.domains.filter(d => !d.single));
  group("Bounded contexts", [...MODEL.contexts]);
})();

const DIAGRAM = MODEL.mermaid;

// `groups` in the settings is one mode for every group, or a map by group id. Same as mermaid.py's group_mode().
const defaultMode = id => typeof DIAGRAM.groups === "object" ? (DIAGRAM.groups[id] || "collapse") : DIAGRAM.groups;
const MODES = [["collapse", "Collapsed"], ["show", "Shown"], ["hide", "Hidden"]];
const groupSels = {};
MODEL.groups.forEach(gr => {
  const label = document.createElement("label");
  label.append(gr.name + " ");
  const sel = document.createElement("select");
  MODES.forEach(([value, text]) => sel.appendChild(new Option(text, value)));
  label.appendChild(sel);
  $("groups").appendChild(label);
  $("groups").append(" ");
  groupSels[gr.id] = sel;
});
const groupModes = () => Object.fromEntries(Object.entries(groupSels).map(([id, sel]) => [id, sel.value]));
if (DIAGRAM.elk) {
  const { default: elkLayouts } = await import("https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs");
  mermaid.registerLayoutLoaders(elkLayouts);
}
mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

function state() {
  return { level: levelSel.value, focus: focusSel.value, depth: Number(depthSel.value), dir: dirSel.value, groups: groupModes() };
}

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  levelSel.value = p.get("level") === "domain" ? "domain" : "context";
  focusSel.value = p.has("focus") && owner[p.get("focus")] ? p.get("focus") : "";
  depthSel.value = p.get("depth") || "1";
  dirSel.value = p.get("dir") || "both";
  Object.entries(groupSels).forEach(([id, sel]) => {
    const m = p.get("group." + id);
    sel.value = MODES.some(([value]) => value === m) ? m : defaultMode(id);
  });
}

function hashFor(s) {
  const p = new URLSearchParams();
  if (s.level !== "context") p.set("level", s.level);
  if (s.focus) p.set("focus", s.focus);
  if (s.depth !== 1) p.set("depth", s.depth);
  if (s.dir !== "both") p.set("dir", s.dir);
  Object.entries(s.groups).forEach(([id, mode]) => { if (mode !== defaultMode(id)) p.set("group." + id, mode); });
  const h = p.toString();
  return h ? "#" + h : "";
}

// Same diagram as mermaid.py's render(): keep the two in step.
const nodeId = id => id.replace(/\W/g, "_");
const groupNodeId = id => nodeId("group_" + id);
const quote = value => value.replaceAll('"', "#quot;");

function mermaidSource(s) {
  const g = GRAPHS[s.level];
  const starts = focusSet(s.level, s.focus);
  const hiddenGroups = new Set(Object.entries(s.groups).filter(([, m]) => m === "hide").map(([id]) => id));
  const visible = walk(g, starts, s.depth, s.dir, hiddenGroups);
  const collapsed = new Set();
  visible.forEach(n => { if (s.groups[g.groups[n]] === "collapse" && !starts.has(n)) collapsed.add(n); });
  const groupBoxes = new Set(MODEL.groups.map(gr => groupNodeId(gr.id)));
  const target = n => collapsed.has(n) ? groupNodeId(g.groups[n]) : nodeId(n);

  const lines = ["---", JSON.stringify({ config: DIAGRAM.config }), "---", `flowchart ${DIAGRAM.direction}`];
  Object.entries(MODEL.types).forEach(([id, t]) =>
    lines.push(`  classDef ${id} ${t.mermaid_style || `fill:${t.color},stroke:${t.border},color:#1a1a1a`}`));
  lines.push(`  classDef focus ${DIAGRAM.focus_style}`);
  MODEL.groups.forEach(gr => lines.push(`  classDef ${groupNodeId(gr.id)} ${gr.mermaid_style || DIAGRAM.group_style}`));

  const plainNodes = [];
  const box = (id, label, type, indent) => { plainNodes.push(id); return `${indent}${nodeId(id)}["${label}"]:::${type}`; };

  const drawDomain = (d, indent) => {
    const hidden = !visible.has(d.id) || collapsed.has(d.id);
    if (s.level === "domain") {
      if (hidden) return [];
      let label = quote(d.name);
      if (!d.single && DIAGRAM.context_labels) label = `<b>${label}</b><br/>` + d.contexts.map(c => quote(contextById[c].name)).join("<br/>");
      return [box(d.id, label, d.type, indent)];
    }
    if (d.single) return hidden ? [] : [box(d.id, quote(d.name), d.type, indent)];
    let shown = d.contexts.filter(c => visible.has(c) && !collapsed.has(c));
    if (!hidden && !shown.length) shown = d.contexts.filter(c => !collapsed.has(c));  // reached as a whole: show what is inside
    if (!shown.length) return hidden ? [] : [box(d.id, quote(d.name), d.type, indent)];
    const out = [`${indent}subgraph ${nodeId(d.id)}["${quote(d.name)}"]`];
    shown.forEach(c => out.push(box(c, quote(contextById[c].name), contextById[c].type, indent + "  ")));
    out.push(`${indent}end`);
    out.push(`${indent}style ${nodeId(d.id)} ${DIAGRAM.domain_style}${d.id === s.focus ? "," + DIAGRAM.focus_style : ""}`);
    return out;
  };

  if (DIAGRAM.group_by_type) {
    Object.entries(MODEL.types).forEach(([typeId, t]) => {
      const block = MODEL.domains.filter(d => d.type === typeId).flatMap(d => drawDomain(d, "    "));
      if (block.length) lines.push(`  subgraph type_${typeId}["${quote(t.label)}"]`, ...block, "  end");
    });
  } else {
    MODEL.domains.forEach(d => lines.push(...drawDomain(d, "  ")));
  }

  MODEL.groups.forEach(gr => {
    const members = [...collapsed].filter(n => g.groups[n] === gr.id).map(nameOf).sort();
    if (members.length) lines.push(`  ${groupNodeId(gr.id)}["<b>${quote(gr.name)}</b><br/>${quote(members.join(", "))}"]:::${groupNodeId(gr.id)}`);
  });

  // Merge edges that land on the same pair once groups are collapsed.
  const merged = new Map();
  g.edges.forEach(e => {
    if (!visible.has(e.from) || !visible.has(e.to)) return;
    const a = target(e.from), b = target(e.to);
    if (a === b) return;
    const key = a + "|" + b;
    if (!merged.has(key)) merged.set(key, { a, b, styles: new Set(), names: new Set(), via: [] });
    const entry = merged.get(key);
    e.styles.forEach(x => entry.styles.add(x));
    entry.via.push(...e.via);
    if (groupBoxes.has(b)) entry.names.add(nameOf(e.to));
    else if (groupBoxes.has(a)) entry.names.add(nameOf(e.from));
  });
  const byStyle = {};
  // What the tooltip of each arrow says, in the order the arrows are drawn.
  const tips = [...merged.values()].map(entry => entry.via.filter(e => e.comment).map(tipEntry));
  [...merged.values()].forEach((entry, i) => {
    const style = entry.styles.has("solid") ? "solid" : [...entry.styles].sort()[0];
    const label = entry.names.size && DIAGRAM.group_labels ? `|"${quote([...entry.names].sort().join(", "))}"|` : "";
    lines.push(`  ${entry.a} ${style === "dotted" ? "-.->" : "-->"}${label} ${entry.b}`);
    (byStyle[style] = byStyle[style] || []).push(i);
  });
  Object.entries(byStyle).forEach(([style, indexes]) =>
    lines.push(`  linkStyle ${indexes.join(",")} interpolate ${DIAGRAM.curve} ${DIAGRAM.edge_styles[style] || ""}`.trimEnd()));

  const highlight = s.level === "domain" && s.focus ? owner[s.focus] : s.focus;
  plainNodes.forEach(n => { if (n === highlight) lines.push(`  class ${nodeId(n)} focus`); });
  // Clicking a box focuses on it. A plain link keeps back and forward working.
  plainNodes.forEach(n => lines.push(`  click ${nodeId(n)} href "${hashFor({ ...s, focus: n })}"`));
  return { source: lines.join("\n") + "\n", visible, tips };
}

let renderCount = 0;
async function render() {
  const s = state();
  history.replaceState(null, "", hashFor(s) || location.pathname);
  const { source, visible, tips } = mermaidSource(s);
  renderInfo(s, visible);
  const run = ++renderCount;
  try {
    const { svg, bindFunctions } = await mermaid.render("diagram-" + run, source);
    if (run !== renderCount) return;  // a newer render took over
    $("graph").innerHTML = svg;
    bindFunctions?.($("graph"));
    bindEdgeHover($("graph").querySelector("svg"), tips);
  } catch (err) {
    if (run === renderCount) $("graph").textContent = "Could not render this diagram: " + err.message;
  }
}

// Hovering an arrow highlights it, its arrowhead and the two boxes it joins, and shows its comments.
function bindEdgeHover(svg, tips) {
  if (!svg) return;
  const paths = [...svg.querySelectorAll("path.flowchart-link")];
  const labels = [...svg.querySelectorAll(".edgeLabel")];
  // Boxes are g elements whose id holds our node id: "<svg>-flowchart-<id>-<n>", or "<svg>-<id>" for a domain.
  const boxes = {};
  svg.querySelectorAll("g[id]").forEach(g => {
    const m = /-flowchart-(.+)-\d+$/.exec(g.id);
    if (m) boxes[m[1]] = g;
    else if (g.classList.contains("cluster")) boxes[g.id.slice(svg.id.length + 1)] = g;
  });
  Object.values(boxes).forEach(g => g.classList.add("box"));
  // An edge id reads "<svg>-L_<from>_<to>_<n>". Ids may hold underscores, so match against the boxes we know.
  const endsOf = path => {
    const rest = path.id.slice(svg.id.length + 3).replace(/_\d+$/, "");
    for (const from of Object.keys(boxes)) {
      if (rest.startsWith(from + "_") && boxes[rest.slice(from.length + 1)]) return [boxes[from], boxes[rest.slice(from.length + 1)]];
    }
    return [];
  };
  const markers = {};  // an accent copy of each arrowhead, made on demand
  const accentMarker = ref => {
    const m = /url\(["']?#([^"')]+)["']?\)/.exec(ref || "");
    const src = m && svg.getElementById(m[1]);
    if (!src) return null;
    if (!markers[m[1]]) {
      const copy = src.cloneNode(true);
      copy.id = m[1] + "-on";
      copy.querySelectorAll("*").forEach(n => { n.style.fill = "var(--accent)"; n.style.stroke = "var(--accent)"; });
      src.parentNode.appendChild(copy);
      markers[m[1]] = copy.id;
    }
    return `url(#${markers[m[1]]})`;
  };

  paths.forEach((path, i) => {
    const hit = path.cloneNode(false);
    hit.removeAttribute("id");
    hit.removeAttribute("style");
    hit.removeAttribute("marker-end");
    hit.removeAttribute("marker-start");
    hit.setAttribute("class", "edge-hit");
    path.after(hit);

    const ends = endsOf(path);
    const label = labels[i];  // mermaid draws labels in edge order
    const marker = path.getAttribute("marker-end");

    const note = tips[i] || [];
    hit.addEventListener("mousemove", ev => showTip(note, ev));
    hit.addEventListener("mouseenter", ev => {
      showTip(note, ev);
      svg.classList.add("hovering");
      path.classList.add("edge-on");
      label?.classList.add("edge-on");
      ends.forEach(n => n.classList.add("node-on"));
      const on = accentMarker(marker);
      if (on) path.setAttribute("marker-end", on);
    });
    hit.addEventListener("mouseleave", () => {
      hideTip();
      svg.classList.remove("hovering");
      path.classList.remove("edge-on");
      label?.classList.remove("edge-on");
      ends.forEach(n => n.classList.remove("node-on"));
      if (marker) path.setAttribute("marker-end", marker);
    });
  });
}

// One entry of a tooltip: always a title (who depends on whom) and a description (the comment).
// An arrow can stand for several dependencies, so every entry names its own.
const tipEntry = dep => ({ title: `${nameOf(dep.from)} → ${nameOf(dep.to)}`, text: dep.comment });

// A small box that follows the cursor. Comments come from context-map.yml, so they go in as text, never as HTML.
const tip = document.createElement("div");
tip.id = "tip";
document.body.appendChild(tip);
function showTip(note, ev) {
  if (!note.length) return hideTip();
  tip.replaceChildren(...note.map(n => {
    const p = document.createElement("p");
    const title = document.createElement("b");
    title.textContent = n.title;
    p.append(title, document.createElement("br"), n.text);
    return p;
  }));
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = ev.clientY + 18 + tip.offsetHeight > window.innerHeight ? ev.clientY - tip.offsetHeight - 12 : ev.clientY + 18;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

const escapeHtml = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const link = id => `<a data-go="${id}">${escapeHtml(nameOf(id))}</a>`;
const list = ids => ids.length ? "<ul>" + ids.map(id => `<li>${link(id)}</li>`).join("") + "</ul>" : '<p class="hint">None</p>';
const chip = type => { const t = MODEL.types[type]; return `<span class="chip" style="background:${t.color};border-color:${t.border}">${t.label}</span>`; };

function renderInfo(s, visible) {
  const legend = '<div class="legend">' + Object.keys(MODEL.types).map(chip).join("") + "</div>";
  const howTo = `<h3>How to read</h3><p class="hint">An arrow from A to B means A depends on B. Upstream is at the top. White boxes are domains, coloured boxes inside them are bounded contexts. ${MODEL.groups.length ? "Dashed boxes stand for a group of bounded contexts folded into one, and the header can show or hide them. " : ""}Click a box to focus on it.</p>`;
  if (!s.focus) {
    $("info").innerHTML = `<h2>Whole system</h2><p class="hint">${visible.size} items shown. Pick a domain or bounded context to see only what it touches.</p>
      <p><a href="mermaid/index.html">Static diagrams</a></p>${legend}${howTo}`;
    return;
  }
  const id = s.focus;
  const item = contextById[id] || domainById[id];
  let html = `<h2>${escapeHtml(item.name)}</h2>${chip(item.type)} <span class="hint">${isMulti(id) ? "Domain" : "Bounded context"}</span>
    <p><a href="mermaid/${id}.html">Static diagram</a> · <a href="mermaid/index.html">All diagrams</a></p>`;
  if (isMulti(id)) {
    html += `<h3>Bounded contexts</h3>${list(domainById[id].contexts)}`;
  } else if (isMulti(owner[id])) {
    html += `<h3>Domain</h3>${list([owner[id]])}`;
  }
  const r = relations(id);
  html += `<h3>Depends on (${r.ups.length})</h3>${list(r.ups)}<h3>Used by (${r.downs.length})</h3>${list(r.downs)}`;
  if (!isMulti(id) && isMulti(owner[id])) {
    const own = GRAPHS.context.edges;
    const dUps = own.filter(e => e.from === owner[id]).map(e => e.to);
    const dDowns = own.filter(e => e.to === owner[id]).map(e => e.from);
    const pname = escapeHtml(nameOf(owner[id]));
    if (dUps.length) html += `<h3>${pname} as a whole depends on</h3>${list(dUps)}`;
    if (dDowns.length) html += `<h3>${pname} as a whole is used by</h3>${list(dDowns)}`;
  }
  $("info").innerHTML = html + `<h3>Legend</h3>${legend}${howTo}`;
}

$("info").addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) { focusSel.value = go.dataset.go; render(); }
});
[levelSel, focusSel, depthSel, dirSel, ...Object.values(groupSels)].forEach(el => el.addEventListener("change", render));
$("reset").addEventListener("click", () => { history.replaceState(null, "", location.pathname); readHash(); render(); });
window.addEventListener("hashchange", () => { readHash(); render(); });

readHash();
render();
</script>
</body>
</html>

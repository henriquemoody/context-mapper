name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # ubuntu-24.04: 26.04 runners no longer offer Python 3.9, which CI still tests.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build the example
        run: |
          context-mapper
          test -f public/index.html
        working-directory: example

# Source of truth for the context map.
#
# Three kinds of thing, in three sections:
# - `types` is the role vocabulary of the model: a domain or bounded context
#   has one, and it colors the box.
# - `clusters` names a set of domains or contexts treated together; its members
#   point at it with `cluster:`.
# - `context-map` maps each id to what it is, so nothing can be described
#   twice: an entry with a `domain:` key is a bounded context of that domain,
#   and any other entry is a domain — one no context points at is a single
#   bounded context. Every entry can carry `downstreams`, who depends on it and
#   why, and the interactive page shows the reason as a tooltip when you hover
#   over that arrow:
#
#   billing:
#     downstreams:
#       packaging: Charges for Packages and Subscriptions
#       pro-account: Charges the monthly subscription
#
# An entry can also record a `violations`: a dependency that goes against the
# direction, such as an upstream that calls its own downstream. It is real, and
# wrong, so the build draws it as a red arrow instead of failing on the cycle it
# makes, and keeps it out of what a focus reaches. Fix it, then delete the line.
#
#   catalog:
#     violations:
#       checkout: Reads the open carts to warm its cache.
#
# Every entry can also carry a `description`: the interactive page shows it as
# a tooltip when you hover over its box, and the item's page shows it in text.
#
# Entries can also set `attributes`: the ones the `attributes` section
# below declares. The build fails on an attribute that was never declared,
# or a value of the wrong shape for the one it declares, so a typo breaks
# the build instead of hiding. An attribute of `type: any` takes whatever
# shape: one named `metadata` is the free-form way, there when a model
# wants it and not built in.
#
# A bounded context can list its `aggregates`: names only, with a root, the
# entities and value objects it holds, and the aggregates it references. A
# reference to another context's aggregate is `context-id/Name`, and the build
# allows it only toward a context that is upstream: one this context depends
# on, directly or through a dependency on its domain as a whole, or one it
# shares a kernel or a partnership with. A violation does not count.
#
# An aggregate, a bounded context or a domain can `publishes` events, and
# `consumes` the ones others publish: names only. `consumes` is a list of
# addresses, or a map from each address to why the consumer reacts to it (or to
# nothing). An event has one address, which mirrors where it is published, and
# what is consumed is always written in full: `context-id/Aggregate/Event` on an aggregate, `context-id/Event` on
# a bounded context, `domain-id/Event` on a domain that holds contexts. The
# build allows it only toward what the consumer depends on, as for references,
# or has a partnership with. A shared kernel and a violation don't count.
#
# A dependency can point at a domain when we don't know yet which of its
# contexts is involved. Move it to the right context once we know.
#
# How it looks (colors, layout, views) lives in context-map.style.yml.

types:
  core:       { name: Core }
  supporting: { name: Supporting }
  generic:    { name: Generic }

# A cluster: its members point at it with `cluster:`.
clusters:
  foundations: { name: Shared Foundations }

# Attributes, declared once: any entry in `context-map` or `clusters` can
# set them with `attributes:`. `text` takes a single value, `list` a list
# of them, `map` label-to-value pairs, `any` whatever shape. The item's page
# and the interactive panel show them under the description.
attributes:
  service:    { name: Service, type: text }
  aggregates: { name: Aggregates, type: list }
  metadata:   { type: any }

# A context takes its domain's `type` unless it sets its own.
context-map:
  # Shared foundations: used by most domains.
  identity:
    name: Identity
    type: generic
    cluster: foundations
    description: Accounts and logins. Everyone signs in here.
    attributes:
      service: identity-service
    publishes: [KeysRotated]                        # a bounded context's event: identity/KeysRotated
    aggregates:
      Account:                                      # an aggregate: a map, or a bare key for a name alone
        description: Who can sign in, and how.
        valueObjects: [Email, PasswordHash]
        publishes:                                  # an aggregate's event: identity/Account/AccountOpened
          AccountOpened: Someone signed up, or a guest checked out.
          AccountClosed:
      Identity:                                     # named like its context, which a page then says once
        description: Who someone is, whoever signs in.
    downstreams:
      checkout:                                     # roles: what each side of the dependency is
        comment: Creates an account for guests who check out.
        upstream: [PublishedLanguage, OpenHostService]   # drawn in the canonical order, not this one
        downstream: [AnticorruptionLayer]
      crm:                                          # a bare key: depends on it, no comment yet
  payments:
    name: Payments
    type: generic
    cluster: foundations
    attributes:
      service: payments-service
      metadata: { owned by: Payments platform, on-call: "#payments-support" }
    aggregates:                                     # a domain no context points at is one itself
      Payment:
        valueObjects: [Amount]
        publishes: [PaymentCaptured, PaymentRefunded]
    downstreams:
      checkout:
        comment: Charges the payment method and signals whether it went through.
        upstream: [Supplier]
        downstream: [Customer]
      fulfillment: Captures the payment once the order ships, and refunds returns.

  catalog:
    name: Catalog
    type: core
    description: Everything that can be bought, with its prices and availability.
    attributes:
      aggregates: [Product, Inventory]
    downstreams:                                    # the whole catalog: we don't know which context yet
      checkout:
        comment: Reads prices and availability at checkout time.
        style: dotted                               # a styled edge: colors live in context-map.style.yml
    violations:                                     # Catalog is upstream of Checkout, and still calls it
      checkout: Reads the open carts to decide what to keep in its cache.
  browsing:
    name: Browsing
    domain: catalog
    attributes: { aggregates: [Session Cart] }      # an attribute named aggregates is still the model's own
    publishes:
      SessionEnded: A visitor left, with or without a cart.
    consumes: [fulfillment/Shipment/ShipmentDispatched]   # the partnership works both ways
    aggregates:
      Session:
        root: Visit                                 # the root is named, not the aggregate
        entities: [Page]
    partnerships:                                   # no direction: a line with no heads, declared once
      fulfillment: Browsing and Fulfillment ship the delivery promise together.
  search:
    name: Search
    domain: catalog
    partnerships:
      checkout: Search and Checkout plan the cart together.
    publishes: [QueryRun]
    consumes:
      checkout/Order/OrderPlaced: Opens the search history of the cart.   # across the partnership: neither is upstream

  orders:
    name: Orders
    type: core
    publishes:                                      # a domain's event: orders/OrderSettled
      OrderSettled: An order was paid and shipped.
    consumes: [identity/Account/AccountOpened]      # the whole domain, as lifted from its contexts
    downstreams:                                    # a dependency pointing at a whole domain
      crm:
        comment: Reads orders to sync them into the ticket system.
        downstream: [Conformist]
  checkout:
    name: Checkout
    domain: orders
    description: Takes a cart and turns it into a paid order.
    attributes:
      service: checkout-service
      aggregates: [Order, Cart]
    publishes: [CartAbandoned]
    consumes: [identity/KeysRotated, search/QueryRun]
    aggregates:
      Order:
        description: A cart that was paid for.
        entities: [OrderLine]
        valueObjects: [Money, Address]
        publishes:
          OrderPlaced: Checkout turned a cart into an order.
        consumes:
          identity/Account/AccountOpened: Links the order to the account a guest just got.   # Checkout depends on Identity
          payments/Payment/PaymentCaptured:           # no reason given
        references:
          - identity/Account                        # Checkout depends on Identity
          - identity/Identity
          - payments/Payment
      Cart:
        entities:                                   # a map gives each name a description
          CartLine: One product, and how many of it.
          Coupon:
        valueObjects: [Quantity]
        consumes: [orders/OrderSettled]             # its own domain's event
        references:
          - checkout/Order                          # this context's own, written in full: a bare `Order` says the same
          - browsing/Session                        # Checkout depends on the Catalog domain as a whole
  fulfillment:
    name: Fulfillment
    domain: orders
    type: supporting                                # a context can override its domain's type
    attributes:
      service: fulfillment-service
      aggregates: [Shipment, Return]
    aggregates:
      Shipment:
        entities: [Package]
        publishes: [ShipmentDispatched]
        consumes:
          payments/Payment/PaymentCaptured: Releases the shipment once it is paid.
          payments/Payment/PaymentRefunded: Takes the returned goods back.
        references: [payments/Payment]              # Fulfillment depends on Payments, and shares a kernel with it
      Return:
        consumes:
          browsing/SessionEnded: Picks up where the visitor left off.
        references: [Shipment, browsing/Session]    # Browsing is Fulfillment's partner, with no direction between them
    sharedKernels:                                  # beside a dependency: Fulfillment still depends on Payments
      payments: Both use the same payment and refund types.

  crm:
    name: CRM
    type: supporting
    consumes:                                                 # the dependency on the Orders domain covers both
      orders/OrderSettled: Syncs the order into the ticket system.
      checkout/Order/OrderPlaced:
    aggregates:
      Ticket:
        entities: [Note]
        consumes: [identity/Account/AccountClosed]
        references:
          - identity/Account
          - checkout/Order                          # CRM depends on the Orders domain as a whole
          - payments/Payment                        # a shared kernel
    sharedKernels:                                  # the two share part of the model itself
      payments: Both use the same payer and invoice types.
